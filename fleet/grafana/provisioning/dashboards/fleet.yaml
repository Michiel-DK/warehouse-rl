apiVersion: 1

# Provisions the fleet dashboard from the directory docker-compose.yml mounts the dashboard file into
# (fleet/grafana/dashboard.json -> /etc/grafana/dashboards/dashboard.json). Rows INTEGRATION, SIMULATION and RESULTS;
# every panel queries the ClickHouse datasource `fleet-clickhouse` (provisioning/datasources/clickhouse.yaml).
providers:
  - name: fleet
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards

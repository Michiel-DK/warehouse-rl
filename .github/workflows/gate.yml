name: gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            scripts/setup.sh
      - name: Set up environment
        run: ./scripts/setup.sh
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee gate.log
      - name: Gate summary (skips and result)
        if: always()
        shell: bash
        run: |
          {
            echo '### Unit gate'
            echo '```'
            grep -E ' \.\.\. skipped' gate.log || echo 'no skipped tests'
            grep -E '^(Ran [0-9]+ tests?|OK|FAILED)' gate.log || echo 'no result line (the run did not finish)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
